server:
  port: 8080
  servlet:
    context-path: '/'
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      pattern: "%h %l %u %t \"%r\" %s %b %Dms"
      prefix: access
      suffix: .log
      rotate: true
    max-swallow-size: 50MB
    max-http-form-post-size: 50MB

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dummy@example.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    enabled: true
    secret: ${JWT_SECRET:very_secret_key_for_production_change_this}
    expSeconds: 3600
  tenant:
    header: X-Tenant-Domain
  orders:
    acceptanceWindowMinutes: ${ORDERS_ACCEPTANCE_WINDOW_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: bharatshop-backend

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production specific settings
devtools: {}

notifications:
  email:
    enabled: true
  whatsapp:
    enabled: true
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v17.0}
    api-key: ${WHATSAPP_API_KEY:dummy_key}
    sender-number: ${WHATSAPP_SENDER_NUMBER:910000000000}

bharatshop:
  maps:
    provider: NOMINATIM
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_dummy}
      key-secret: ${RAZORPAY_KEY_SECRET:dummy_secret}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    com.bharatshop: INFO
