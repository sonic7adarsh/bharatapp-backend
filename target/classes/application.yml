server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      pattern: "%h %l %u %t \"%r\" %s %b %Dms"
      prefix: access
      suffix: .log
      rotate: true

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    default-property-inclusion: non_null
  datasource:
    url: jdbc:h2:mem:bharatshop;DB_CLOSE_DELAY=-1;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    enabled: true
    secret: dev-insecure-secret-change
    expSeconds: 3600
  tenant:
    header: X-Tenant-Domain
  orders:
    acceptanceWindowMinutes: ${ORDERS_ACCEPTANCE_WINDOW_MINUTES:15}

logging:
  level:
    org.springframework.security: INFO
    com.bharatshop: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: bharatshop-backend

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui

notifications:
  provider: log # set 'twilio' or 'msg91' to enable providers
  msg91:
    apiKey: ${MSG91_AUTH_KEY:}
    templateId: ${MSG91_TEMPLATE_ID:}
    senderId: ${MSG91_SENDER_ID:}
  twilio:
    accountSid: ${TWILIO_ACCOUNT_SID:}
    authToken: ${TWILIO_AUTH_TOKEN:}
    fromNumber: ${TWILIO_FROM_NUMBER:}
    messagingServiceSid: ${TWILIO_MESSAGING_SERVICE_SID:}
  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}